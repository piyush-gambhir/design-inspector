name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true




jobs:
  verify:
    name: Unit tests, types, production build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security
      - run: pnpm check

  browser:
    name: Browser tests (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security

      - name: Resolve the Playwright version for the browser cache key
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies only
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium







      - name: Install the fonts the fixtures name
        run: sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core





      - name: Build the shipped extension
        run: pnpm exec wxt build
      - name: Build the test extension
        run: DI_E2E=1 pnpm exec wxt build
      - name: Fixture browser tests, accessibility, and performance
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-artifacts-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
