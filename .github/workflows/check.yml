name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public repositories get the standard GitHub-hosted runners free and unlimited
# (4 vCPU, 16 GB on ubuntu-latest). Larger runners are always billed, so the
# free lever is parallelism: unit gate and browser shards run side by side.
jobs:
  verify:
    name: Unit tests, types, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  browser:
    name: Browser tests (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version for the browser cache key
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies only
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The fixtures name Liberation and DejaVu explicitly, because a runner has
      # no Inter, no Helvetica Neue and no Georgia: without a family that is
      # really there, every text metric on a fixture page is whatever the
      # fallback happens to be. apt-get install is idempotent, and
      # install-deps already brings fonts-liberation, so this is the belt to
      # that braces plus the wide face the 300px pane test asserts against.
      - name: Install the fonts the fixtures name
        run: sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core

      # Two builds, because the suite asserts on both. The DI_E2E build keeps
      # host_permissions so a fixture tab can be injected without a toolbar
      # click; the plain build is the shipped manifest, which the smoke test
      # reads off disk to prove no host permissions ship.
      - name: Build the shipped extension
        run: pnpm exec wxt build
      - name: Build the test extension
        run: DI_E2E=1 pnpm exec wxt build
      - name: Fixture browser tests, accessibility, and performance
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
