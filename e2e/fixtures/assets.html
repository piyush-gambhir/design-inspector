<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assets fixture</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font: 16px/1.5 system-ui, sans-serif;
        color: #18181b;
        background: #ffffff;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }
      img {
        width: 48px;
        height: 48px;
        background: #e4e4e7;
      }
      /* A background layer that is not also used by an <img>, so it stays its
         own row in the asset list. */
      #panel {
        width: 240px;
        height: 96px;
        background-image: url('tile.png');
        background-size: cover;
        border-radius: 8px;
      }
      video {
        width: 320px;
        height: 180px;
        background: #09090b;
      }
    </style>
  </head>
  <body>
    <h1>Assets fixture</h1>

    <!-- The same file referenced three times: one row with a usage count of 3. -->
    <div class="row">
      <img id="swatch-a" src="swatch.png" alt="Swatch" />
      <img id="swatch-b" src="swatch.png" alt="Swatch again" />
      <img id="swatch-c" src="swatch.png" alt="Swatch once more" />
      <!-- This one 404s, so the bulk export records it as skipped. -->
      <img id="missing" src="missing.png" alt="Missing image" />
    </div>

    <div class="row">
      <svg id="mark" width="32" height="32" viewBox="0 0 32 32" aria-label="Mark">
        <circle cx="16" cy="16" r="14" fill="#2563eb"></circle>
      </svg>
      <div id="panel"></div>
    </div>

    <!-- A data: poster image plus an http source that 404s. -->
    <video
      id="clip"
      controls
      poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
    >
      <source src="clip.mp4" type="video/mp4" />
    </video>
  </body>
</html>
