<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Inspector fixture: 20px root</title>
    <!--
      Same hero as inspector-basic.html with a 20px root font size, so rem
      conversions are checked against the inspected document rather than an
      assumed 16px (PRD TYP-01).
    -->
    <style>
      :root {
        font-size: 20px;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #101828;
        font-family: 'Nonexistent Display', 'Liberation Serif', Georgia, 'Times New Roman', serif;
      }

      main {
        padding: 32px 24px;
      }

      #hero-heading {
        margin: 0 0 12px;
        font-family: 'Nonexistent Display', 'Liberation Sans', Arial, Helvetica, sans-serif;
        font-size: 40px;
        font-weight: 700;
        line-height: 48px;
        letter-spacing: 0;
      }

      #body-copy {
        margin: 0;
        font-size: 20px;
        line-height: 30px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="hero-heading">Two rem at a twenty pixel root</h1>
      <p id="body-copy">This paragraph is exactly one rem at this root size.</p>
    </main>
  </body>
</html>
