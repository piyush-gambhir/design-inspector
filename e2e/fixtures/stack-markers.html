<!doctype html>
<html lang="en" q:container="paused">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="generator" content="Hugo 0.128.0" />
    <title>Design Inspector fixture: stack markers</title>
    <!--
      Static fixture for stack detection. Every signal here is a marker or an
      attribute the detector reads from the DOM: nothing is fetched, no script
      runs, and no third-party request is made. The frames carry the URLs the
      embed signatures look for but are lazy, so they are never loaded.

      Ids and attributes are part of the test contract. Keep them stable.
    -->
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }

      .swiper,
      .splide {
        height: 40px;
        background: #eef1f6;
      }

      iframe {
        width: 320px;
        height: 180px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>Stack markers</h1>

    <!-- Frameworks: Gatsby by mount point, Alpine and htmx by attribute. -->
    <div id="___gatsby">
      <div x-data="{ open: false }">Alpine island</div>
      <button hx-get="/fragment" hx-target="#slot">htmx trigger</button>
      <div id="slot"></div>
    </div>

    <!-- Stimulus: two weak attributes, which together read as likely. -->
    <div data-controller="reveal" data-action="click->reveal#toggle">Stimulus island</div>

    <!-- Motion: two carousels that need no script to be recognised. -->
    <div class="swiper">Swiper track</div>
    <div class="splide">Splide track</div>
    <div data-barba="container">Barba container</div>

    <!-- Embeds: lazy, so the fixture stays offline. -->
    <iframe
      title="YouTube embed"
      loading="lazy"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    ></iframe>
    <iframe
      title="Vimeo embed"
      loading="lazy"
      src="https://player.vimeo.com/video/76979871"
    ></iframe>
  </body>
</html>
