# Single-package repo. Keep allowBuilds explicit so pnpm does not skip esbuild.
allowBuilds:
  esbuild: true
  spawn-sync: true
pmOnFail: warn
verifyDepsBeforeRun: false
# Patched transitive versions for open advisories, each scoped to one major.
overrides:
  esbuild@<0.28.1: ^0.28.1
  shell-quote@<1.11.0: ^1.11.0
  source-map-js@<1.2.2: ^1.2.2
  undici@>=7.0.0 <7.30.1: 7.30.1
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
minimumReleaseAgeExclude:
  - undici@7.30.1
  - fast-uri@3.1.9
patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
